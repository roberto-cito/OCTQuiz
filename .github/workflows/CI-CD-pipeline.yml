name: All-Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Test RunningTest
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          MAIL: ${{ secrets.MAIL }}
          PASSWORD_MAIL: ${{ secrets.PASSWORD_MAIL }}
        run: mvn -B test -Dtest=com.oct.octquiz.RunningTest

      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results (RunningTest)
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

  Controller-test:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: octquiz
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Test Controller
        env:
          DB_URL: jdbc:mysql://localhost:3306/octquiz
          DB_USER: root
          DB_PASS: root
          MAIL: ${{ secrets.MAIL }}
          PASSWORD_MAIL: ${{ secrets.PASSWORD_MAIL }}
        run: mvn -B test -Dtest=com.oct.octquiz.Controller.**

      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results (Controller)
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

  Model-test:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: octquiz
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Test Model
        env:
          DB_URL: jdbc:mysql://localhost:3306/octquiz
          DB_USER: root
          DB_PASS: root
          MAIL: ${{ secrets.MAIL }}
          PASSWORD_MAIL: ${{ secrets.PASSWORD_MAIL }}
        run: mvn -B test -Dtest=com.oct.octquiz.Model.**

      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results (Model)
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

  E2E-test:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: octquiz
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Test E2E (LoginE2ETest)
        env:
          DB_URL: jdbc:mysql://localhost:3306/octquiz
          DB_USER: root
          DB_PASS: root
          MAIL: ${{ secrets.MAIL }}
          PASSWORD_MAIL: ${{ secrets.PASSWORD_MAIL }}
        run: mvn -B test -Dtest=LoginE2ETest

      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results (E2E)
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

  build-docker-image:
    needs: [build-and-test, Controller-test, Model-test, E2E-test]
    runs-on: ubuntu-latest
    # Modificato: disabilito la build docker poiché la repository è a solo scopo di portfolio.
    if: false

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/octquiz:latest
          build-args: |
            DB_URL=${{ secrets.DB_URL }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASS=${{ secrets.DB_PASS }}
            MAIL=${{ secrets.MAIL }}
            PASSWORD_MAIL=${{ secrets.PASSWORD_MAIL }}

  deploy-to-server:
    needs: build-docker-image
    runs-on: ubuntu-latest
    # Modificato: disabilito il deploy poiché la repository è a solo scopo di portfolio.
    if: false

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # 1. Fondamentale: qui elenchiamo le variabili da esportare nella sessione SSH
          envs: DB_URL,DB_USER,DB_PASS,EMAIL_SENDER,EMAIL_ADMIN,EMAIL_PASSWORD
          # ... nel deploy-to-k8s di OctQuiz
          script: |
            # Crea il secret anche nel namespace octquiz se serve
            sudo kubectl create secret generic octquiz-bot-secrets --namespace octquiz --from-literal=bot-url="http://octhome-bot-service.octhome:8245/request" --dry-run=client -o yaml | sudo kubectl apply -f -
            
            # 2. Crea il Secret: i nomi $VARIABILE devono coincidere con 'envs' sopra
            sudo kubectl create secret generic octquiz-secrets \
              --namespace octquiz \
              --from-literal=db-url="$DB_URL" \
              --from-literal=db-user="$DB_USER" \
              --from-literal=db-pass="$DB_PASS" \
              --from-literal=mail="$EMAIL_SENDER" \
              --from-literal=admin-mail="$EMAIL_ADMIN" \
              --from-literal=mail-pass="$EMAIL_PASSWORD" \
              --dry-run=client -o yaml | sudo kubectl apply -f -
            
            sudo kubectl apply -f ~/yaml/octquiz-workload.yaml
            sudo kubectl apply -f ~/yaml/ingress.yaml
            sudo kubectl rollout restart deployment/octquiz-app -n octquiz
        env:
          DB_URL: "jdbc:mysql://mysql-service.octquiz:3306/octquiz?allowPublicKeyRetrieval=true&useSSL=false"
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_ADMIN: ${{ secrets.EMAIL_ADMIN }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}