<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCT - Risultato Quiz</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/result.css}">
    <link rel="icon" type="image/png" th:href="@{/photo/logo.png}">
</head>

<body>

    <div th:replace="~{fragments/header :: logged(user=${user})}"></div>

    <main>
        <div class="result-container">
            <h1 class="result-title">Quiz Completato!</h1>
            <p class="result-message">Hai completato il quiz per la categoria <strong
                    th:text="${categoria.nome}">Categoria</strong>.</p>

            <div class="score-circle">
                <span class="score-value" th:text="${punteggio}">0</span>
                <span class="score-total">su <span th:text="${totale}">0</span></span>
            </div>

            <!-- Sezione Revisione Domande -->
            <div class="review-section">
                <h2 class="review-title">Riepilogo Risposte</h2>

                <div th:each="domanda : ${domande}" th:if="${!domanda.onlyText}" class="review-card"
                    th:with="userAns=${userAnswers['' + domanda.id]}">
                    <p class="review-question">
                        <span th:text="${domandaStat.count} + '. '">1. </span>
                        <span th:text="${domanda.domanda}">Testo Domanda</span>
                    </p>

                    <img th:if="${domanda.foto != null and !domanda.foto.isEmpty()}"
                        th:src="@{/{imageName}(imageName=${domanda.foto})}" class="review-image" alt="Immagine domanda">

                    <audio th:if="${domanda.audio != null and !domanda.audio.isEmpty()}" controls class="review-audio">
                        <source th:src="@{/{audioName}(audioName=${domanda.audio})}" type="audio/mpeg">
                        Il tuo browser non supporta l'elemento audio.
                    </audio>

                    <div th:if="${userAns == null}" class="not-answered-info">
                        <p class="not-answered-text">Non hai risposto a questa domanda.</p>
                        <button class="btn-toggle-answer" onclick="toggleAnswer(this)">Mostra Risposta Corretta</button>
                    </div>

                    <div class="review-options" th:classappend="${userAns == null ? 'hidden-options' : ''}">
                        <!-- Option 1 -->
                        <div class="review-option"
                            th:classappend="${domanda.rispostaCorretta == 1 ? 'correct' : (userAns == 1 ? 'wrong' : '')}">
                            <span th:text="${domanda.risposta1}">Risposta 1</span>
                            <span th:if="${userAns == 1}" class="user-marker">(La tua risposta)</span>
                        </div>

                        <!-- Option 2 -->
                        <div class="review-option"
                            th:classappend="${domanda.rispostaCorretta == 2 ? 'correct' : (userAns == 2 ? 'wrong' : '')}">
                            <span th:text="${domanda.risposta2}">Risposta 2</span>
                            <span th:if="${userAns == 2}" class="user-marker">(La tua risposta)</span>
                        </div>

                        <!-- Option 3 -->
                        <div class="review-option"
                            th:classappend="${domanda.rispostaCorretta == 3 ? 'correct' : (userAns == 3 ? 'wrong' : '')}">
                            <span th:text="${domanda.risposta3}">Risposta 3</span>
                            <span th:if="${userAns == 3}" class="user-marker">(La tua risposta)</span>
                        </div>

                        <!-- Option 4 -->
                        <div class="review-option"
                            th:classappend="${domanda.rispostaCorretta == 4 ? 'correct' : (userAns == 4 ? 'wrong' : '')}">
                            <span th:text="${domanda.risposta4}">Risposta 4</span>
                            <span th:if="${userAns == 4}" class="user-marker">(La tua risposta)</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="buttons-container">
                <a th:href="@{/}" class="btn btn-secondary">Torna alla Home</a>
                <a th:href="@{/quiz(id=${categoria.id})}" class="btn btn-primary">Riprova</a>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer}"></div>

    <script>
        function toggleAnswer(button) {
            const reviewCard = button.closest('.review-card');
            const options = reviewCard.querySelector('.review-options');
            if (options.classList.contains('hidden-options')) {
                options.classList.remove('hidden-options');
                button.textContent = 'Nascondi Risposta Corretta';
            } else {
                options.classList.add('hidden-options');
                button.textContent = 'Mostra Risposta Corretta';
            }
        }
    </script>

</body>

</html>
