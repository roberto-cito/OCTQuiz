<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Pagina Non Trovata | OCT</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" type="image/png" th:href="@{/photo/logo.png}">
    <style>
        .error-container {
            min-height: calc(100vh - 200px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-32);
            text-align: center;
        }
        .error-code {
            font-size: 120px;
            font-weight: 800;
            line-height: 1;
            margin-bottom: var(--space-16);
            background: linear-gradient(135deg, var(--color-primary), #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0.2;
            position: absolute;
            z-index: -1;
        }
        .error-content {
            position: relative;
            z-index: 1;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/header :: minimal}"></div>

    <main class="error-container">
        <div class="error-code">404</div>
        <div class="error-content">
            <h1 class="hero-title" style="margin-bottom: var(--space-16);">
                Oops! <span class="highlight">Pagina Non Trovata</span>
            </h1>
            <p class="hero-subtitle" style="margin-bottom: var(--space-32);">
                La pagina che stai cercando non esiste o è stata spostata. 
                Torna alla home per continuare il tuo allenamento.
            </p>
            <div class="hero-buttons" style="justify-content: center;">
                <a th:href="@{/}" class="btn btn-primary btn-large">
                    Torna alla Home
                </a>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer}"></div>

    <script>
        // Header scroll effect
        window.addEventListener('scroll', () => {
            const header = document.querySelector('.header');
            if (window.pageYOffset > 50) {
                header.style.boxShadow = 'var(--shadow-md)';
            } else {
                header.style.boxShadow = 'none';
            }
        });
    </script>
</body>
</html>
