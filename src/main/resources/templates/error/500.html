<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Errore Interno | OCT</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" type="image/png" th:href="@{/photo/logo.png}">
    <style>
        .error-container {
            min-height: calc(100vh - 200px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-32);
            text-align: center;
        }
        .error-code {
            font-size: 120px;
            font-weight: 800;
            line-height: 1;
            margin-bottom: var(--space-16);
            background: linear-gradient(135deg, var(--color-error), #f87171);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0.2;
            position: absolute;
            z-index: -1;
        }
        .error-content {
            position: relative;
            z-index: 1;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/header :: minimal}"></div>

    <main class="error-container">
        <div class="error-code">500</div>
        <div class="error-content">
            <h1 class="hero-title" style="margin-bottom: var(--space-16);">
                Errore <span class="highlight">Interno del Server</span>
            </h1>
            <p class="hero-subtitle" style="margin-bottom: var(--space-32);">
                Qualcosa è andato storto nei nostri server. Stiamo già lavorando per risolvere il problema.
                Riprova più tardi o torna alla home.
            </p>
            <div class="hero-buttons" style="justify-content: center;">
                <a th:href="@{/}" class="btn btn-primary btn-large">
                    Torna alla Home
                </a>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer}"></div>
</body>
</html>
