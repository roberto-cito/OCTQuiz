<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCT - Password Aggiornata</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/forgotpassword.css}">
    <link rel="icon" type="image/png" th:href="@{/photo/logo.png}">
</head>
<body>

<div th:replace="~{fragments/header :: minimal}"></div>

<main class="auth-wrapper">
    <div class="auth-card" style="text-align: center;">

        <div style="
            width: 80px;
            height: 80px;
            margin: 0 auto var(--space-24);
            background: linear-gradient(135deg, var(--color-blue-500), var(--color-blue-300));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-md);">

            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>

        <h1 class="auth-title">Password Aggiornata!</h1>

        <p class="auth-description" style="margin-bottom: var(--space-32);">
            La tua password è stata modificata con successo.<br>
            Ora puoi accedere utilizzando le tue nuove credenziali.
        </p>

        <a href="/" class="btn btn-primary btn-large" style="width: 100%; text-decoration: none;">
            Torna alla Home
        </a>

    </div>
</main>

<div th:replace="~{fragments/footer}"></div>

<script>
    // Script per l'ombra dell'header allo scroll (come nelle altre pagine)
    let lastScroll = 0;
    window.addEventListener('scroll', () => {
        const header = document.querySelector('.header');
        const currentScroll = window.pageYOffset;

        if (currentScroll > 10) {
            header.style.boxShadow = 'var(--shadow-md)';
        } else {
            header.style.boxShadow = 'none';
        }
        lastScroll = currentScroll;
    });
</script>

</body>
</html>
