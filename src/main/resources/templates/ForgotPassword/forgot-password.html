<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCT - Reimposta Password</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/forgotpassword.css}">
    <link rel="icon" type="image/png" th:href="@{/photo/logo.png}">
</head>
<body>

<div th:replace="~{fragments/header :: withBackBtn}"></div>

<main class="auth-wrapper">
    <div class="auth-card">
        <h1 class="auth-title">Reimposta Password</h1>
        <p class="auth-description">
            Inserisci il codice OTP ricevuto via email e imposta la tua nuova password.
        </p>

        <form method="POST" th:action="@{/confirm-password}" th:object="${confirmPasswordForm}">

            <input type="hidden" th:field="*{email}">
            <div class="error-message" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

            <div class="form-group">
                <label class="form-label" for="otpCode" style="text-align: center;">Codice OTP</label>
                <input type="text"
                       id="otpCode"
                       th:field="*{otp}"
                       class="form-input otp-input"
                       placeholder="000000"
                       maxlength="6"
                       required
                       autocomplete="one-time-code">
                <div class="error-message" th:if="${#fields.hasErrors('otp')}" th:errors="*{otp}"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="newPassword">Nuova Password</label>
                <div class="password-container">
                    <input type="password"
                           id="newPassword"
                           th:field="*{newPassword}"
                           class="form-input"
                           placeholder="••••••••"
                           required>
                    <button type="button" class="password-toggle" onclick="togglePassword('newPassword', this)">
                        <img th:src="@{/photo/eye.png}" alt="Mostra password">
                    </button>
                </div>
                <div class="error-message" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirmPassword">Conferma Nuova Password</label>
                <div class="password-container">
                    <input type="password"
                           id="confirmPassword"
                           th:field="*{confirmNewPassword}"
                           class="form-input"
                           placeholder="••••••••"
                           required>
                    <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword', this)">
                        <img th:src="@{/photo/eye.png}" alt="Mostra password">
                    </button>
                </div>
                <div class="error-message" th:if="${#fields.hasErrors('confirmNewPassword')}" th:errors="*{confirmNewPassword}"></div>
            </div>

            <button type="submit" class="btn btn-primary btn-large" style="width: 100%; margin-top: var(--space-8);">
                Salva Nuova Password
            </button>

        </form>
    </div>
</main>

<div th:replace="~{fragments/footer}"></div>

<script>
    let lastScroll = 0;
    window.addEventListener('scroll', () => {
        const header = document.querySelector('.header');
        const currentScroll = window.pageYOffset;

        if (currentScroll > 10) {
            header.style.boxShadow = 'var(--shadow-md)';
        } else {
            header.style.boxShadow = 'none';
        }
        lastScroll = currentScroll;
    });
</script>

</body>
</html>
